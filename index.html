<!DOCTYPE html>
<html>
    <body>
        <div id="player"></div>
    </body>

    <script>
        var player;

        function postMessage(name, options = {}) {
            if (window.parent != window.self) {
                window.parent.postMessage(JSON.stringify({
                    name,
                    options,
                }), '*');
            }
        }

        function onVideoReady() {
            console.log("onVideoReady");
            postMessage('ready');
           
        }

        function onVideoError(e) {
            console.error("onVideoError", e);
        }

        function onAPILoaded() {
            console.log("onAPILoaded");

            YT.ready(function() {
                player = new YT.Player('player', {
                    width: '100%',
                    height: '100%',
                    playerVars: {
                        autoplay: 1,
                        cc_load_policy: 3,
                        controls: 0,
                        disablekb: 1,
                        enablejsapi: 1,
                        fs: 0,
                        iv_load_policy: 3,
                        loop: 0,
                        modestbranding: 1,
                        playsinline: 1,
                        rel: 0
                    },
                    events: {
                        onError: onVideoError,
                        onReady: onVideoReady,
                        onApiChange: onVideoAPIChange,
                        onStateChange: onVideoStateChange
                    }
                });

                postMessage('ready');
                player.loadVideoById({
                    videoId: 'DotnJ7tTA34',
                    startSeconds: 0
                });
            });
        }

        function onAPIError(e) {
            console.error("onAPIError", e);
            postMessage('error');
        }

        var apiScriptElement = document.createElement('script');
        apiScriptElement.type = 'text/javascript';
        apiScriptElement.src = 'https://www.youtube.com/iframe_api';
        apiScriptElement.onload = onAPILoaded;
        apiScriptElement.onerror = onAPIError;
        document.body.appendChild(apiScriptElement);

        window.addEventListener("message", (event) => {
            console.log('CHILD');
            console.log(event);
            
            try {
                var message = JSON.parse(event.data);
                console.log(message);

                if (message.name === 'loadVideoById') {
                    player.loadVideoById({
                        videoId: message.options.videoId,
                        startSeconds: message.options.startSeconds,
                    });
                }

                if (message.name === 'cueVideoById') {
                    player.cueVideoById({
                        videoId: message.options.videoId,
                        startSeconds: message.options.startSeconds,
                    });
                }

                if (message.name === 'stopVideo') {
                    player.stopVideo();
                }

                if (message.name === 'destroy') {
                    player.destroy();
                }
            } catch (e) {
                console.error('Failed to parse message', e)
            }
        });
    </script>
</html>
