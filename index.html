<!DOCTYPE html>
<html>
    <body>
        <div id="player"></div>
    </body>

    <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
        }
    </style>

    <script>
        var player;

        function postMessage(name, options = {}) {
            if (window.parent != window.self) {
                window.parent.postMessage(JSON.stringify({
                    name,
                    options,
                }), '*');
            }
        }

        function onVideoReady() {
            console.log("onVideoReady");
            postMessage('ready');
           
        }

        function onVideoError(e) {
            console.error("onVideoError", e);
        }

        function onVideoAPIChange() {
            player.loadModule('captions');
            player.setOption('captions', 'track', {});
            postMessage('propChanged', 'paused');
            postMessage('propChanged', 'time');
            postMessage('propChanged', 'duration');
            postMessage('propChanged', 'buffering');
            postMessage('propChanged', 'volume');
            postMessage('propChanged', 'muted');
            postMessage('propChanged', 'playbackSpeed');
            postMessage('propChanged', 'subtitlesTracks');
            postMessage('propChanged', 'selectedSubtitlesTrackId');
        }
    
        function onVideoStateChange(state) {
            postMessage('propChanged', 'buffering');
            switch (state.data) {
                case YT.PlayerState.ENDED: {
                    onEnded();
                    break;
                }
                case YT.PlayerState.CUED:
                case YT.PlayerState.UNSTARTED:
                case YT.PlayerState.PAUSED:
                case YT.PlayerState.PLAYING: {
                    postMessage('propChanged', 'paused');
                    postMessage('propChanged', 'time');
                    postMessage('propChanged', 'buffering');
                    break;
                }
            }
        }

        function onYouTubeIframeAPIReady() {
            console.log('onYouTubeIframeAPIReady');
            
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 1,
                    cc_load_policy: 3,
                    controls: 0,
                    disablekb: 1,
                    enablejsapi: 1,
                    fs: 0,
                    iv_load_policy: 3,
                    loop: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    rel: 0
                },
                events: {
                    onError: onVideoError,
                    onReady: onVideoReady,
                    onApiChange: onVideoAPIChange,
                    onStateChange: onVideoStateChange
                }
            });
        }

        function onAPILoaded() {
            console.log("onAPILoaded");
        }

        function onAPIError(e) {
            console.error("onAPIError", e);
            postMessage('error');
        }

        var apiScriptElement = document.createElement('script');
        apiScriptElement.type = 'text/javascript';
        apiScriptElement.src = 'https://www.youtube.com/iframe_api';
        apiScriptElement.onload = onAPILoaded;
        apiScriptElement.onerror = onAPIError;
        document.body.appendChild(apiScriptElement);

        window.addEventListener("message", (event) => {
            console.log('CHILD');
            console.log(event);
            
            try {
                var message = JSON.parse(event.data);
                console.log(message);

                if (message.name === 'loadVideoById') {
                    player.loadVideoById({
                        videoId: message.options.videoId,
                        startSeconds: message.options.startSeconds,
                    });
                }

                if (message.name === 'cueVideoById') {
                    player.cueVideoById({
                        videoId: message.options.videoId,
                        startSeconds: message.options.startSeconds,
                    });
                }

                if (message.name === 'stopVideo') {
                    player.stopVideo();
                }

                if (message.name === 'destroy') {
                    player.destroy();
                }
            } catch (e) {
                console.error('Failed to parse message', e)
            }
        });
    </script>
</html>
