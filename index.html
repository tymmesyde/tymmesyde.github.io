<!DOCTYPE html>
<html>
    <body>
        <div id="player"></div>
    </body>

    <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            background-color: black;
        }
    </style>

    <script>
        var YOUTUBE_ORIGIN = 'https://www.youtube.com';
        var player;
        var timeIntervalId;

        function startPollingTime() {
            clearInterval(timeIntervalId);
            timeIntervalId = window.setInterval(function() {
                if (!player) return;

                var time = player.getCurrentTime();
                sendEvent('time', time);
            }, 500);
        }

        function stopPollingTime() {
            clearInterval(timeIntervalId);
            timeIntervalId = null;
        }

        function onReady() {
            console.log("onReady");
            sendEvent('ready');
        }

        function onError(e) {
            console.error("onError", e);
        }

        function onApiChange() {
            console.log('onApiChange');
            
            player.loadModule('captions');
            player.setOption('captions', 'track', {});
        }
    
        function onStateChange(state) {
            console.log('onStateChange');

            switch (state.data) {
                case YT.PlayerState.ENDED: {
                    sendEvent('ended');
                    break;
                }
                case YT.PlayerState.BUFFERING: {
                    sendEvent('buffering', true);
                    break;
                }
                case YT.PlayerState.CUED:
                case YT.PlayerState.PAUSED:
                case YT.PlayerState.PLAYING: {
                    var duration = player.getDuration();
                    sendEvent('duration', duration);

                    sendEvent('buffering', false);
                    sendEvent('paused', state.data !== YT.PlayerState.PLAYING);
                    break;
                }
            }
        }

        function onPlaybackRateChange(state) {
            console.log('onPlaybackRateChange');
            var rate = player.getPlaybackRate();
            sendEvent('playbackRate', rate);
        }

        function onYouTubeIframeAPIReady() {
            console.log('onYouTubeIframeAPIReady');
            
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 1,
                    cc_load_policy: 3,
                    controls: 0,
                    disablekb: 1,
                    enablejsapi: 1,
                    fs: 0,
                    iv_load_policy: 3,
                    loop: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    rel: 0
                },
                events: {
                    onError: onError,
                    onReady: onReady,
                    onApiChange: onApiChange,
                    onStateChange: onStateChange,
                    onPlaybackRateChange: onPlaybackRateChange,
                }
            });
        }

        function sendEvent(name, ...args) {
            if (window.parent != window.self) {
                window.parent.postMessage(JSON.stringify({
                    name,
                    args,
                }), '*');
            }
        }

        function onMessage(message) {
            console.log(message);
            var name = message.name;
            var args = message.args;

            if (name === 'loadVideoById') {
                var videoId = args[0];
                var startSeconds = args[1];
                player.loadVideoById({
                    videoId: videoId,
                    startSeconds: startSeconds,
                });
            }

            if (name === 'cueVideoById') {
                var videoId = args[0];
                var startSeconds = args[1];
                player.cueVideoById({
                    videoId: videoId,
                    startSeconds: startSeconds,
                });
            }

            if (name === 'pauseVideo') {
                player.pauseVideo();
                stopPollingTime();
            }

            if (name === 'playVideo') {
                player.playVideo();
                startPollingTime();
            }

            if (name === 'seekTo') {
                var time = args[0];
                player.seekTo(time);
            }

            if (name === 'mute') {
                player.mute();
            }

            if (name === 'unMute') {
                player.unMute();
            }

            if (name === 'setVolume') {
                var volume = args[0];
                player.setVolume(volume);
            }

            if (name === 'setPlaybackRate') {
                var rate = args[0];
                player.setPlaybackRate(rate);
            }

            if (name === 'stopVideo') {
                player.stopVideo();
                stopPollingTime();
            }

            if (name === 'destroy') {
                player.destroy();
                stopPollingTime();
            }
        }

        window.addEventListener("message", (event) => {
            if (event.origin === YOUTUBE_ORIGIN) return;
            console.log('CHILD');
            console.log(event);

            try {
                var message = JSON.parse(event.data);
                onMessage(message);
            } catch (e) {
                console.error('Failed to parse message', e)
            }
        });

        function onAPILoaded() {
            console.log("onAPILoaded");
        }

        function onAPIError(e) {
            console.error("onAPIError", e);
            sendEvent('error');
        }

        var apiScriptElement = document.createElement('script');
        apiScriptElement.type = 'text/javascript';
        apiScriptElement.src = 'https://www.youtube.com/iframe_api';
        apiScriptElement.onload = onAPILoaded;
        apiScriptElement.onerror = onAPIError;
        document.body.appendChild(apiScriptElement);
    </script>
</html>
